<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexum Hero</title>

  <!-- Google Fonts: Geist & Silkscreen -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Geist", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            silkscreen: ["Silkscreen", "cursive"],
          },
        },
      },
    };
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }
    .font-silkscreen {
      font-family: 'Silkscreen', cursive;
    }
    .btn-gradient {
      background: linear-gradient(to bottom, #2B2B2B, #101010);
    }
    .btn-gradient:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const ChevronDown = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m6 9 6 6 6-6" />
      </svg>
    );

    const MenuIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="4" x2="20" y1="12" y2="12" />
        <line x1="4" x2="20" y1="6" y2="6" />
        <line x1="4" x2="20" y1="18" y2="18" />
      </svg>
    );

    const XIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    );

    const NexumLogo = ({ className = "w-6 h-6" }) => (
      <svg className={className} viewBox="0 0 256 256">
        <path
          d="M 128 128 C 128 198.692 70.692 256 0 256 C 0 185.308 57.308 128 128 128 Z M 128 128 C 198.692 128 256 185.308 256 256 C 185.308 256 128 198.692 128 128 Z M 0 0 C 70.692 0 128 57.308 128 128 C 57.308 128 0 70.692 0 0 Z M 256 0 C 256 70.692 198.692 128 128 128 C 128 57.308 185.308 0 256 0 Z"
          fill="currentColor"
        />
      </svg>
    );

    function NexumHero() {
      const [menuOpen, setMenuOpen] = useState(false);
      const [email, setEmail] = useState("");

      // Body scroll locking when mobile menu is open
      useEffect(() => {
        if (menuOpen) {
          document.body.style.overflow = "hidden";
        } else {
          document.body.style.overflow = "";
        }
        return () => {
          document.body.style.overflow = "";
        };
      }, [menuOpen]);

      const navLinks = [
        { label: "Modules", href: "#modules" },
        { label: "Clientele", href: "#clientele" },
        { label: "Solutions", href: "#solutions", hasChevron: true },
        { label: "Billing", href: "#billing" },
      ];

      const handleEmailSubmit = (e) => {
        e.preventDefault();
        if (email) {
          alert(`Thank you for signing up with ${email}!`);
          setEmail("");
        }
      };

      return (
        <section className="relative h-screen w-full overflow-hidden">
          {/* Full-bleed background video */}
          <video
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260803_192301_9231ed6b-c55c-4a48-909c-4ebe11cf2e11.mp4"
            autoPlay
            loop
            muted
            playsInline
            className="absolute inset-0 h-full w-full object-cover z-0 pointer-events-none"
          />

          {/* Content layer sitting directly over the video */}
          <div className="relative z-10 flex flex-col h-full w-full">
            {/* Top Navigation Bar */}
            <header className="flex items-center justify-between px-5 py-5 sm:px-8 sm:py-6 lg:px-12 w-full">
              {/* Logo */}
              <a href="#" className="flex items-center gap-2 text-[#010101] lg:text-white transition-colors">
                <NexumLogo className="w-6 h-6 fill-current text-current" />
                <span className="text-lg font-semibold tracking-tight">nexum</span>
              </a>

              {/* Desktop Navigation */}
              <div className="hidden md:flex items-center gap-3">
                {/* Glass Pill Cluster */}
                <nav className="rounded-full bg-white/10 px-1.5 py-1.5 backdrop-blur-lg flex items-center gap-1">
                  {navLinks.map((link) => (
                    <a
                      key={link.label}
                      href={link.href}
                      className="rounded-full px-4 py-1.5 text-sm font-medium text-white/80 transition-colors hover:bg-white/10 hover:text-white inline-flex items-center gap-1"
                    >
                      <span>{link.label}</span>
                      {link.hasChevron && <ChevronDown className="w-3.5 h-3.5" />}
                    </a>
                  ))}
                </nav>

                {/* Separate Get Started Pill */}
                <a
                  href="#get-started"
                  className="rounded-full px-5 text-sm font-medium text-white self-stretch flex items-center justify-center btn-gradient"
                >
                  Get started
                </a>
              </div>

              {/* Mobile Hamburger Button */}
              <button
                onClick={() => setMenuOpen(!menuOpen)}
                aria-label={menuOpen ? "Close menu" : "Open menu"}
                className="md:hidden relative h-10 w-10 rounded-full bg-white/10 backdrop-blur-lg z-50 flex items-center justify-center text-[#010101] lg:text-white"
              >
                <span
                  className={`absolute transition-all duration-300 ${
                    menuOpen ? "rotate-90 scale-0 opacity-0" : "rotate-0 scale-100 opacity-100"
                  }`}
                >
                  <MenuIcon className="w-5 h-5" />
                </span>
                <span
                  className={`absolute transition-all duration-300 ${
                    menuOpen ? "rotate-0 scale-100 opacity-100" : "-rotate-90 scale-0 opacity-0"
                  }`}
                >
                  <XIcon className="w-5 h-5" />
                </span>
              </button>
            </header>

            {/* Mobile Glass Backdrop & Slide-In Drawer */}
            <div
              onClick={() => setMenuOpen(false)}
              className={`fixed inset-0 z-40 bg-black/80 backdrop-blur-md transition-opacity duration-300 md:hidden ${
                menuOpen ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none"
              }`}
            />
            <div
              className={`fixed right-0 top-0 z-40 h-full w-72 bg-black/90 backdrop-blur-xl flex flex-col md:hidden transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                menuOpen ? "translate-x-0" : "translate-x-full"
              }`}
            >
              <div className="px-6 pt-24 flex flex-col gap-2">
                {navLinks.map((link, idx) => (
                  <a
                    key={link.label}
                    href={link.href}
                    onClick={() => setMenuOpen(false)}
                    style={{
                      transitionDelay: menuOpen ? `${(idx + 1) * 60}ms` : "0ms",
                      transform: menuOpen ? "translateX(0)" : "translateX(24px)",
                      opacity: menuOpen ? 1 : 0,
                    }}
                    className="rounded-xl px-4 py-3.5 text-base font-medium text-white/80 transition-all duration-300 hover:bg-white/10 hover:text-white flex items-center justify-between"
                  >
                    <span>{link.label}</span>
                    {link.hasChevron && <ChevronDown className="w-4 h-4" />}
                  </a>
                ))}
              </div>

              <div
                className="mt-auto px-6 pb-10"
                style={{
                  transitionDelay: menuOpen ? "300ms" : "0ms",
                  transform: menuOpen ? "translateY(0)" : "translateY(16px)",
                  opacity: menuOpen ? 1 : 0,
                  transitionDuration: "400ms",
                }}
              >
                <a
                  href="#get-started"
                  onClick={() => setMenuOpen(false)}
                  className="block w-full rounded-full py-3.5 text-center text-sm font-medium text-white btn-gradient"
                >
                  Get started
                </a>
              </div>
            </div>

            {/* Bottom-Anchored Main Content */}
            <main className="mt-auto px-5 pb-8 sm:px-8 sm:pb-12 lg:px-12 lg:pb-16 w-full">
              <div className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6 sm:gap-8">
                {/* Left: Headline + Email CTA */}
                <div className="max-w-xl">
                  <h1 className="text-3xl sm:text-4xl lg:text-[3.5rem] font-semibold leading-[1.1] tracking-tight text-[#010101] lg:text-white">
                    Ship AI workers that grind while you rest
                  </h1>

                  {/* Email Input Capsule CTA */}
                  <form
                    onSubmit={handleEmailSubmit}
                    className="mt-6 sm:mt-8 flex flex-col sm:inline-flex sm:flex-row sm:items-center sm:rounded-full sm:bg-white sm:p-1.5 gap-3 sm:gap-0"
                  >
                    <input
                      type="email"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="Type your email"
                      required
                      className="rounded-full bg-white px-5 py-3 text-sm text-gray-900 placeholder-gray-400 outline-none sm:w-64 sm:rounded-none sm:bg-transparent sm:px-4 sm:py-2"
                    />
                    <button
                      type="submit"
                      className="rounded-full px-6 py-3 sm:py-2.5 text-sm font-medium text-white btn-gradient self-stretch sm:self-auto"
                    >
                      Get started
                    </button>
                  </form>
                </div>

                {/* Right: Two Glass Cards */}
                <div className="flex flex-col gap-4 sm:flex-row lg:w-auto lg:gap-5 w-full sm:w-auto">
                  {/* Stats Card */}
                  <div className="rounded-2xl bg-white/10 backdrop-blur-lg p-5 sm:p-6 sm:w-64 flex flex-col justify-between">
                    <div>
                      <div className="font-silkscreen text-3xl sm:text-4xl font-normal tracking-tight text-[#010101] lg:text-white">
                        42,500+
                      </div>
                      <p className="text-sm leading-relaxed mt-3 sm:mt-4 text-[#010101]/70 lg:text-white/70">
                        Teams run Nexum to handle recurring ops daily.
                      </p>
                    </div>
                  </div>

                  {/* Testimonial Card */}
                  <div className="rounded-2xl bg-white/10 backdrop-blur-lg p-5 sm:p-6 sm:w-64 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center gap-2 mb-3 sm:mb-4">
                        <div className="w-6 h-6 rounded-md bg-black flex items-center justify-center text-white text-xs font-bold">
                          S
                        </div>
                        <span className="text-sm font-semibold text-[#010101] lg:text-white">Stratify</span>
                      </div>
                      <p className="text-sm leading-relaxed text-[#010101]/80 lg:text-white/80">
                        "With Nexum we went from managing tedious operational work to having AI agents that handle everything."
                      </p>
                    </div>

                    <div className="mt-4 sm:mt-5 flex items-center gap-3">
                      <img
                        src="https://i.pravatar.cc/72?img=12"
                        alt="Sara Klein"
                        className="w-9 h-9 rounded-full object-cover bg-white/20"
                        onError={(e) => {
                          e.target.style.display = 'none';
                        }}
                      />
                      <div>
                        <div className="text-sm font-semibold text-[#010101] lg:text-white">Sara Klein</div>
                        <div className="text-xs text-[#010101]/60 lg:text-white/60">Dir of Operations</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </main>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<NexumHero />);
  </script>
</body>
</html>
