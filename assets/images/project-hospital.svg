<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="primaryAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Architectural Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Dashboard Window Frame -->
  <rect x="50" y="40" width="700" height="370" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))"/>
  
  <!-- Window Header -->
  <path d="M 50 54 Q 50 40 64 40 L 736 40 Q 750 40 750 54 L 750 85 L 50 85 Z" fill="#1e293b"/>
  <circle cx="78" cy="62" r="5" fill="#ef4444"/>
  <circle cx="95" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="112" cy="62" r="5" fill="#10b981"/>
  <text x="140" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Hospital Central Management Core • Java &amp; MySQL 3NF</text>
  <rect x="620" y="52" width="110" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="675" y="67" fill="#818cf8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">ONLINE (PORT: 3306)</text>

  <!-- Left Sidebar Nav -->
  <rect x="50" y="85" width="160" height="325" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <rect x="65" y="105" width="130" height="32" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="80" cy="121" r="4" fill="#3b82f6"/>
  <text x="95" y="125" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Patient Triage</text>
  
  <rect x="65" y="145" width="130" height="28" rx="6" fill="transparent"/>
  <text x="95" y="163" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Doctor Roster</text>
  
  <rect x="65" y="180" width="130" height="28" rx="6" fill="transparent"/>
  <text x="95" y="198" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Billing &amp; Pharmacy</text>
  
  <rect x="65" y="215" width="130" height="28" rx="6" fill="transparent"/>
  <text x="95" y="233" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Bed Allotment</text>

  <rect x="65" y="250" width="130" height="28" rx="6" fill="transparent"/>
  <text x="95" y="268" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">SQL Analytics</text>

  <!-- Main Content Dashboard Area -->
  <!-- Stat Card 1 -->
  <rect x="230" y="105" width="155" height="75" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="245" y="125" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="600">ACTIVE PATIENTS</text>
  <text x="245" y="153" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="22" font-weight="700">1,428</text>
  <text x="245" y="170" fill="#10b981" font-family="'Inter', sans-serif" font-size="10">↑ 12% Admissions</text>

  <!-- Stat Card 2 -->
  <rect x="400" y="105" width="155" height="75" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="415" y="125" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="600">DOCTORS ON CALL</text>
  <text x="415" y="153" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="22" font-weight="700">64 Depts</text>
  <text x="415" y="170" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10">100% Scheduled</text>

  <!-- Stat Card 3 -->
  <rect x="570" y="105" width="155" height="75" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="585" y="125" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="600">INVOICE INTEGRITY</text>
  <text x="585" y="153" fill="#a855f7" font-family="'Inter', sans-serif" font-size="22" font-weight="700">100%</text>
  <text x="585" y="170" fill="#a855f7" font-family="'Inter', sans-serif" font-size="10">ACID Compliant</text>

  <!-- Database Table Mockup -->
  <rect x="230" y="195" width="495" height="195" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1"/>
  <rect x="230" y="195" width="495" height="28" rx="8" fill="#172033"/>
  <text x="245" y="213" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">PATIENT ID</text>
  <text x="330" y="213" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">NAME &amp; AGE</text>
  <text x="445" y="213" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">DEPARTMENT</text>
  <text x="560" y="213" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">CONSULTING DR</text>
  <text x="670" y="213" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">STATUS</text>

  <!-- Table Row 1 -->
  <line x1="230" y1="230" x2="725" y2="230" stroke="#1e293b"/>
  <text x="245" y="247" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">#MED-8091</text>
  <text x="330" y="247" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Sarah Jenkins, 34</text>
  <text x="445" y="247" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Cardiology</text>
  <text x="560" y="247" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Dr. Vance (Cardio)</text>
  <rect x="665" y="236" width="55" height="16" rx="8" fill="#065f46"/>
  <text x="692" y="248" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Admitted</text>

  <!-- Table Row 2 -->
  <line x1="230" y1="262" x2="725" y2="262" stroke="#1e293b"/>
  <text x="245" y="279" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">#MED-8092</text>
  <text x="330" y="279" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">David Chen, 48</text>
  <text x="445" y="279" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Neurology</text>
  <text x="560" y="279" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Dr. Mehta (Neuro)</text>
  <rect x="665" y="268" width="55" height="16" rx="8" fill="#1e3a8a"/>
  <text x="692" y="280" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">In Surgery</text>

  <!-- Table Row 3 -->
  <line x1="230" y1="294" x2="725" y2="294" stroke="#1e293b"/>
  <text x="245" y="311" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10">#MED-8093</text>
  <text x="330" y="311" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10">Elena Rostov, 29</text>
  <text x="445" y="311" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Orthopedics</text>
  <text x="560" y="311" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Dr. Miller (Ortho)</text>
  <rect x="665" y="300" width="55" height="16" rx="8" fill="#701a75"/>
  <text x="692" y="312" fill="#f472b6" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Discharged</text>

  <!-- SQL Query Snippet Tag -->
  <rect x="240" y="340" width="475" height="38" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
  <text x="252" y="363" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">SELECT p.name, b.bed_no, inv.total_due FROM patients p JOIN billing inv ON p.id=inv.p_id;</text>
</svg>

