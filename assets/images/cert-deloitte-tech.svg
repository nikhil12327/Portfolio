  <!-- Recipient Name -->
  <text x="40" y="115" fill="#000000" font-family="'Inter', sans-serif" font-size="24" font-weight="800">Nikhil Bonigala</text>
  
  <!-- Certification Program Title -->
  <text x="40" y="150" fill="#0f172a" font-family="'Inter', sans-serif" font-size="18" font-weight="700">Technology Job Simulation</text>
  <text x="40" y="175" fill="#64748b" font-family="'Inter', sans-serif" font-size="13">Certificate of Completion • January 15th, 2026</text>

