<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="v1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="v1Light" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#v1Grad)"/>
  <rect width="640" height="360" fill="url(#v1Light)"/>

  <!-- Anamorphic Lens Flare Line -->
  <line x1="0" y1="160" x2="640" y2="160" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  <circle cx="384" cy="160" r="120" fill="#38bdf8" opacity="0.15" filter="blur(20px)"/>

  <!-- Dramatic Cinematic Elements -->
  <path d="M 220 360 L 320 180 L 420 360 Z" fill="#090d16" opacity="0.95"/>
  <circle cx="320" cy="150" r="22" fill="#fbbf24" opacity="0.9" filter="drop-shadow(0 0 20px #f59e0b)"/>

  <!-- Play Button Overlay -->
  <g transform="translate(280, 140)">
    <circle cx="40" cy="40" r="36" fill="rgba(15, 23, 42, 0.75)" stroke="#f8fafc" stroke-width="2"/>
    <polygon points="34,26 54,40 34,54" fill="#f8fafc"/>
  </g>

  <!-- Tags -->
  <rect x="25" y="25" width="120" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
  <text x="85" y="43" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">SHOWREEL 2025</text>

  <rect x="540" y="310" width="75" height="26" rx="6" fill="rgba(0,0,0,0.7)"/>
  <text x="577" y="327" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">01:24</text>
</svg>

