<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ridexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ridexBg)"/>

  <!-- App Window Frame -->
  <rect x="50" y="35" width="700" height="380" rx="14" fill="#0c111d" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 50 49 Q 50 35 64 35 L 736 35 Q 750 35 750 49 L 750 75 L 50 75 Z" fill="#161f30"/>
  <circle cx="75" cy="55" r="5" fill="#ef4444"/>
  <circle cx="92" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="109" cy="55" r="5" fill="#10b981"/>
  <text x="135" y="59" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">RIDEX • Real-Time Bike Taxi Platform (React.js + Firebase)</text>
  <rect x="610" y="45" width="120" height="22" rx="11" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="670" y="60" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">LIVE FIRESTORE</text>

  <!-- Left: Mobile Customer / Rider App View -->
  <g transform="translate(80, 95)">
    <rect width="210" height="295" rx="16" fill="#090d16" stroke="#334155" stroke-width="2"/>
    
    <!-- Map Simulation -->
    <rect x="10" y="10" width="190" height="150" rx="10" fill="#1e293b"/>
    <!-- Map Streets Grid -->
    <line x1="10" y1="60" x2="200" y2="60" stroke="#334155" stroke-width="4"/>
    <line x1="10" y1="110" x2="200" y2="110" stroke="#334155" stroke-width="4"/>
    <line x1="80" y1="10" x2="80" y2="160" stroke="#334155" stroke-width="4"/>
    <line x1="140" y1="10" x2="140" y2="160" stroke="#334155" stroke-width="4"/>

    <!-- GPS Route Line -->
    <path d="M 40 130 Q 80 110, 80 60 L 150 60" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Pickup & Drop Pin -->
    <circle cx="40" cy="130" r="5" fill="#10b981"/>
    <circle cx="150" cy="60" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Bike Taxi Icon -->
    <circle cx="95" cy="60" r="7" fill="#f59e0b"/>
    
    <!-- Ride Info Card -->
    <rect x="10" y="170" width="190" height="115" rx="8" fill="#161f30"/>
    <text x="22" y="192" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Bike Fast-Pass • Arriving</text>
    <text x="22" y="208" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Rider: Rajesh (4.9 ★) • Yamaha FZ</text>
    
    <!-- Live Status Pill -->
    <rect x="22" y="218" width="80" height="18" rx="9" fill="#064e3b"/>
    <text x="62" y="231" fill="#34d399" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">OTP: 4892</text>

    <rect x="22" y="246" width="166" height="26" rx="6" fill="#f59e0b"/>
    <text x="105" y="263" fill="#000000" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Wallet Paid • ₹65.00</text>
  </g>

  <!-- Right: Admin Dashboard & Telemetry Monitor -->
  <g transform="translate(315, 95)">
    <!-- KPI Row -->
    <rect width="130" height="60" rx="8" fill="#161f30" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" font-weight="600">ACTIVE RIDES</text>
    <text x="15" y="48" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="20" font-weight="800">142</text>

    <rect x="145" width="130" height="60" rx="8" fill="#161f30" stroke="#1e293b" stroke-width="1"/>
    <text x="160" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" font-weight="600">DAILY REVENUE</text>
    <text x="160" y="48" fill="#34d399" font-family="'Inter', sans-serif" font-size="20" font-weight="800">₹18.4K</text>

    <rect x="290" width="125" height="60" rx="8" fill="#161f30" stroke="#1e293b" stroke-width="1"/>
    <text x="305" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" font-weight="600">RIDERS ONLINE</text>
    <text x="305" y="48" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="20" font-weight="800">89</text>

    <!-- Real-Time Activity Log -->
    <rect y="72" width="415" height="223" rx="8" fill="#080c14" stroke="#1e293b" stroke-width="1"/>
    <rect y="72" width="415" height="26" rx="8" fill="#131926"/>
    <text x="15" y="89" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">REAL-TIME FIRESTORE STREAM</text>
    
    <!-- Stream Log 1 -->
    <text x="15" y="120" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9">● [14:28:01] RIDE_ACCEPTED</text>
    <text x="160" y="120" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">Ride #RD-9021 → Rider #RD-44 assigned</text>

    <!-- Stream Log 2 -->
    <text x="15" y="145" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">● [14:27:54] WALLET_DEBIT</text>
    <text x="160" y="145" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">User #US-1022 (-₹45.00) Balance: ₹320</text>

    <!-- Stream Log 3 -->
    <text x="15" y="170" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">● [14:27:30] RIDER_VERIFIED</text>
    <text x="160" y="170" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">KYC Approved for Ramesh (DL &amp; RC)</text>

    <!-- Stream Log 4 -->
    <text x="15" y="195" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="9">● [14:26:12] RIDE_COMPLETED</text>
    <text x="160" y="195" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">Distance: 4.8 km • Time: 12 min • 5★</text>

    <!-- Tech Stack Pill Footer -->
    <rect x="15" y="240" width="385" height="38" rx="6" fill="#101622" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="263" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">React.js • Vite • Tailwind CSS • Firebase Auth • Firestore DB</text>
  </g>
</svg>

