<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="v2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#v2Grad)"/>

  <!-- 2.39:1 Letterbox Bars -->
  <rect x="0" y="0" width="640" height="46" fill="#000000"/>
  <rect x="0" y="314" width="640" height="46" fill="#000000"/>

  <!-- Atmospheric Room Lighting & Window Silhouettes -->
  <polygon points="120,46 220,46 160,314 40,314" fill="#34d399" opacity="0.12"/>
  <rect x="380" y="110" width="140" height="170" rx="8" fill="#06121e" opacity="0.9"/>
  <ellipse cx="450" cy="170" rx="30" ry="40" fill="#0f172a"/>

  <!-- Play Button Overlay -->
  <g transform="translate(280, 140)">
    <circle cx="40" cy="40" r="36" fill="rgba(6, 78, 59, 0.85)" stroke="#34d399" stroke-width="2"/>
    <polygon points="34,26 54,40 34,54" fill="#ffffff"/>
  </g>

  <!-- Tags -->
  <rect x="25" y="60" width="150" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
  <text x="100" y="78" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">NARRATIVE SHORT</text>

  <rect x="540" y="270" width="75" height="26" rx="6" fill="rgba(0,0,0,0.7)"/>
  <text x="577" y="287" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">03:15</text>
</svg>

