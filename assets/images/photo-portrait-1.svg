<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="portraitGlow" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="#090d16"/>
  <rect width="600" height="800" fill="url(#portraitGlow)"/>

  <!-- Creamy Bokeh Orbs -->
  <circle cx="150" cy="180" r="45" fill="#fef08a" opacity="0.3" filter="blur(10px)"/>
  <circle cx="480" cy="220" r="60" fill="#fed7aa" opacity="0.25" filter="blur(15px)"/>
  <circle cx="400" cy="120" r="30" fill="#f97316" opacity="0.35" filter="blur(8px)"/>

  <!-- Portrait Silhouette -->
  <g transform="translate(300, 380)">
    <path d="M -120 420 C -100 280, -40 240, 0 240 C 40 240, 100 280, 120 420 Z" fill="#0f172a"/>
    <ellipse cx="0" cy="90" rx="60" ry="80" fill="#1e293b"/>
    <!-- Golden Rim Light Contour -->
    <path d="M -40 30 C 10 10, 55 40, 60 100 C 60 140, 30 170, 0 170" fill="none" stroke="#fbbf24" stroke-width="3" filter="drop-shadow(0 0 8px #f59e0b)"/>
  </g>

  <!-- Editorial Info -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="35" y="45" fill="#fed7aa" font-family="'JetBrains Mono', monospace" font-size="11">GOLDEN HOUR CINEMATIC PORTRAIT</text>
  <text x="35" y="760" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">85MM • F/1.8 • 1/1000S • ISO 100 • NATURAL BACKLIGHT</text>
</svg>

