<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="davinciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <linearGradient id="colorWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="33%" stop-color="#10b981"/>
      <stop offset="66%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#davinciBg)"/>

  <!-- Color Grading Suite Window Frame -->
  <rect x="50" y="35" width="700" height="380" rx="14" fill="#0c0d14" stroke="#2a2b3d" stroke-width="1.5"/>

  <!-- Top Bar -->
  <path d="M 50 49 Q 50 35 64 35 L 736 35 Q 750 35 750 49 L 750 75 L 50 75 Z" fill="#181926"/>
  <circle cx="75" cy="55" r="5" fill="#ef4444"/>
  <circle cx="92" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="109" cy="55" r="5" fill="#10b981"/>
  <text x="135" y="59" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">DaVinci Resolve Studio • Color Management (Rec.709 / Log)</text>
  <rect x="610" y="45" width="120" height="22" rx="11" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="670" y="60" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">24.000 FPS</text>

  <!-- Left: Cinematic Video Monitor -->
  <g transform="translate(75, 90)">
    <rect width="360" height="200" rx="8" fill="#000000" stroke="#374151" stroke-width="1"/>
    
    <!-- Cinematic Aspect Ratio 2.39:1 Letterbox inside -->
    <rect x="0" y="25" width="360" height="150" fill="#1e1b4b"/>
    
    <!-- Visual Shot Composition Graphic -->
    <ellipse cx="180" cy="110" rx="70" ry="40" fill="#312e81" opacity="0.8"/>
    <ellipse cx="180" cy="95" rx="35" ry="35" fill="#fbbf24" opacity="0.9" filter="drop-shadow(0 0 15px rgba(251,191,36,0.6))"/>
    <path d="M 120 175 C 140 135, 220 135, 240 175 Z" fill="#0f172a"/>
    
    <!-- Scopes / Timecode Overlay -->
    <text x="15" y="45" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">REC ● [00:01:24:18]</text>
    <text x="270" y="45" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">4K DCI (4096x2160)</text>
    <text x="15" y="165" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="9">LOOK: WARM KODAK 2383</text>
  </g>

  <!-- Right: Color Wheels & Node Tree -->
  <g transform="translate(455, 90)">
    <!-- Node Tree -->
    <rect width="270" height="95" rx="8" fill="#13141f" stroke="#2a2b3d" stroke-width="1"/>
    <text x="15" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">3-NODE COLOR TREE</text>
    
    <!-- Node 1: Exposure/Balance -->
    <rect x="20" y="38" width="60" height="40" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="50" y="55" fill="#c7d2fe" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">01: Bal</text>
    <text x="50" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">CST Log</text>

    <line x1="80" y1="58" x2="105" y2="58" stroke="#6366f1" stroke-width="1.5"/>

    <!-- Node 2: Contrast & Skin Tone -->
    <rect x="105" y="38" width="60" height="40" rx="5" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="135" y="55" fill="#fde68a" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">02: Skin</text>
    <text x="135" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">HSL Mask</text>

    <line x1="165" y1="58" x2="190" y2="58" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Node 3: Film Emulation -->
    <rect x="190" y="38" width="60" height="40" rx="5" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
    <text x="220" y="55" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">03: Look</text>
    <text x="220" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">2383 Curve</text>

    <!-- RGB Parade Scopes -->
    <rect y="105" width="270" height="95" rx="8" fill="#08080d" stroke="#2a2b3d" stroke-width="1"/>
    <text x="15" y="125" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">PARADE SCOPES (R G B)</text>
    
    <!-- Red Scope Wave -->
    <path d="M 30 185 Q 45 140, 60 170 Q 75 130, 90 185" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.85"/>
    <!-- Green Scope Wave -->
    <path d="M 115 185 Q 130 145, 145 165 Q 160 135, 175 185" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.85"/>
    <!-- Blue Scope Wave -->
    <path d="M 200 185 Q 215 150, 230 175 Q 245 140, 260 185" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.85"/>
  </g>

  <!-- Bottom Timeline Track -->
  <g transform="translate(75, 305)">
    <rect width="650" height="85" rx="8" fill="#10111a" stroke="#2a2b3d" stroke-width="1"/>
    
    <!-- Video Track V1 -->
    <rect x="15" y="15" width="140" height="26" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="25" y="32" fill="#bfdbfe" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Clip_01_Intro.mov</text>

    <rect x="160" y="15" width="180" height="26" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="170" y="32" fill="#c7d2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Clip_02_Hero_Action.braw</text>

    <rect x="345" y="15" width="290" height="26" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="355" y="32" fill="#bfdbfe" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Clip_03_Climax_Grade.mov</text>

    <!-- Audio Track A1 / A2 Waveforms -->
    <rect x="15" y="47" width="325" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="64" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9">A1: Master Score &amp; Foley (48kHz 24-bit)</text>

    <rect x="345" y="47" width="290" height="26" rx="4" fill="#581c87" stroke="#a855f7" stroke-width="1"/>
    <text x="355" y="64" fill="#f3e8ff" font-family="'Inter', sans-serif" font-size="9">A2: Dialogue &amp; Reverb Ducking</text>

    <!-- Playhead Marker -->
    <line x1="280" y1="5" x2="280" y2="80" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="274,5 286,5 280,12" fill="#f59e0b"/>
  </g>
</svg>

