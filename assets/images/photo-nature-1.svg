<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Mountain Ridge 1 (Furthest, Faintest) -->
  <path d="M 0 320 Q 200 240, 420 280 T 800 250 L 800 450 L 0 450 Z" fill="#1e293b" opacity="0.6"/>
  <!-- Morning Mist Layer 1 -->
  <rect x="0" y="270" width="800" height="40" fill="#94a3b8" opacity="0.15" filter="blur(10px)"/>

  <!-- Mountain Ridge 2 (Midground) -->
  <path d="M 0 350 Q 260 290, 500 340 T 800 300 L 800 450 L 0 450 Z" fill="#0f172a" opacity="0.85"/>
  <!-- Morning Mist Layer 2 -->
  <rect x="0" y="320" width="800" height="35" fill="#cbd5e1" opacity="0.2" filter="blur(8px)"/>

  <!-- Mountain Ridge 3 (Foreground Silhouette) -->
  <path d="M 0 390 Q 220 350, 450 380 T 800 350 L 800 450 L 0 450 Z" fill="#020617"/>

  <!-- Pine Tree Silhouettes on Foreground -->
  <polygon points="120,400 125,370 130,400" fill="#020617"/>
  <polygon points="128,405 133,365 138,405" fill="#020617"/>
  <polygon points="140,410 145,375 150,410" fill="#020617"/>
  <polygon points="560,395 565,360 570,395" fill="#020617"/>
  <polygon points="572,400 577,355 582,400" fill="#020617"/>

  <!-- Metadata Overlay -->
  <rect x="25" y="25" width="750" height="400" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="45" y="55" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">MINIMALIST HORIZON &amp; MIST</text>
  <text x="45" y="405" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">135MM • F/5.6 • 1/400S • ISO 100 • TELEPHOTO ATMOSPHERE</text>
</svg>

