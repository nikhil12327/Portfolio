<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="streetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lightRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#streetGrad)"/>

  <!-- Harsh High-Contrast Urban Shadows & Light Slice -->
  <polygon points="120,0 280,0 520,800 360,800" fill="url(#lightRay)"/>
  
  <!-- Architectural Silhouette Blocks -->
  <rect x="0" y="0" width="160" height="800" fill="#030712"/>
  <polygon points="160,0 320,0 160,500" fill="#090d16"/>
  
  <!-- Human Silhouette in Light Beam -->
  <g transform="translate(380, 520)">
    <!-- Long Shadow Cast -->
    <ellipse cx="-80" cy="180" rx="140" ry="25" fill="#000000" opacity="0.85"/>
    
    <!-- Walking Figure -->
    <circle cx="0" cy="0" r="14" fill="#030712"/>
    <path d="M -12 18 L 12 18 L 16 110 L 8 180 L -4 180 L 2 110 L -10 175 L -18 175 L -8 100 Z" fill="#030712"/>
  </g>

  <!-- Editorial Film Metadata Border Overlay -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="35" y="45" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">NIKHIL BONIGALA // STREET 01</text>
  <text x="35" y="760" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11">50MM • F/2.2 • 1/800S • ISO 100</text>
</svg>

