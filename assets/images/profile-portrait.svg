<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="180"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="#090d16"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#accentGlow)" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="200" r="180" fill="url(#avatarGrad)"/>
  <circle cx="200" cy="180" r="150" fill="url(#halo)"/>

  <!-- Subtle grid lines behind avatar -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="40" x2="100" y2="360"/>
    <line x1="200" y1="20" x2="200" y2="380"/>
    <line x1="300" y1="40" x2="300" y2="360"/>
    <line x1="40" y1="100" x2="360" y2="100"/>
    <line x1="20" y1="200" x2="380" y2="200"/>
    <line x1="40" y1="300" x2="360" y2="300"/>
  </g>

  <!-- Stylized Geometric Avatar Silhouette -->
  <g clip-path="url(#circleClip)">
    <!-- Shoulders / Torso -->
    <path d="M 90 380 C 100 290, 150 260, 200 260 C 250 260, 300 290, 310 380 Z" fill="#1e293b"/>
    <path d="M 120 380 C 135 305, 170 280, 200 280 C 230 280, 265 305, 280 380 Z" fill="#334155" opacity="0.7"/>

    <!-- Neck & Head Base -->
    <rect x="180" y="210" width="40" height="60" rx="8" fill="#e2e8f0" opacity="0.9"/>
    
    <!-- Stylized Head Profile -->
    <ellipse cx="200" cy="165" rx="55" ry="68" fill="#cbd5e1"/>
    
    <!-- Hair & Creative Accent -->
    <path d="M 145 155 C 145 105, 175 95, 215 95 C 250 95, 260 115, 260 145 C 255 140, 240 135, 220 135 C 190 135, 170 145, 145 155 Z" fill="#0f172a"/>
    <path d="M 145 155 C 145 130, 160 105, 195 100 C 240 95, 260 120, 258 150 C 245 140, 230 135, 205 138 C 175 142, 160 152, 145 155 Z" fill="#1e1b4b"/>
    
    <!-- Glasses / Modern Creative Tech Look -->
    <rect x="165" y="150" width="30" height="20" rx="5" fill="none" stroke="#6366f1" stroke-width="3"/>
    <rect x="205" y="150" width="30" height="20" rx="5" fill="none" stroke="#6366f1" stroke-width="3"/>
    <line x1="195" y1="158" x2="205" y2="158" stroke="#6366f1" stroke-width="3"/>
    
    <!-- Camera/Lens Badge Icon Over Shoulder -->
    <circle cx="285" cy="310" r="28" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <circle cx="285" cy="310" r="14" fill="#312e81" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="285" cy="310" r="6" fill="#818cf8"/>
  </g>

  <!-- Creative & Code Floating Tags -->
  <g font-family="'Inter', sans-serif" font-size="11" font-weight="600">
    <rect x="30" y="55" width="105" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.9"/>
    <text x="82" y="72" fill="#c7d2fe" text-anchor="middle">AI &amp; Software</text>
    
    <rect x="265" y="55" width="105" height="26" rx="13" fill="#1e1b4b" stroke="#ec4899" stroke-width="1" opacity="0.9"/>
    <text x="317" y="72" fill="#fbcfe8" text-anchor="middle">Video &amp; Photo</text>
  </g>
</svg>

