<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#stockBg)"/>

  <!-- Trading Terminal Window Frame -->
  <rect x="50" y="35" width="700" height="380" rx="14" fill="#080c14" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Bar -->
  <path d="M 50 49 Q 50 35 64 35 L 736 35 Q 750 35 750 49 L 750 75 L 50 75 Z" fill="#111827"/>
  <circle cx="75" cy="55" r="5" fill="#ef4444"/>
  <circle cx="92" cy="55" r="5" fill="#f59e0b"/>
  <circle cx="109" cy="55" r="5" fill="#10b981"/>
  <text x="135" y="59" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Stock Market ML Predictor &amp; Quantitative Trading Pipeline</text>
  <rect x="600" y="45" width="130" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="665" y="60" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">SHARPE: 2.14 (BUY)</text>

  <!-- Left Chart: Candlestick & Technical Indicators -->
  <g transform="translate(75, 90)">
    <rect width="420" height="210" rx="8" fill="#040711" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Grid Lines -->
    <g opacity="0.12" stroke="#64748b" stroke-width="1">
      <line x1="0" y1="50" x2="420" y2="50"/>
      <line x1="0" y1="100" x2="420" y2="100"/>
      <line x1="0" y1="150" x2="420" y2="150"/>
      <line x1="80" y1="0" x2="80" y2="210"/>
      <line x1="160" y1="0" x2="160" y2="210"/>
      <line x1="240" y1="0" x2="240" y2="210"/>
      <line x1="320" y1="0" x2="320" y2="210"/>
    </g>

    <!-- Moving Average 50 & 200 EMA -->
    <path d="M 10 160 Q 90 140, 160 110 T 300 70 T 410 40" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 10 170 Q 120 160, 220 130 T 410 80" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Candlestick 1 (Green) -->
    <line x1="40" y1="130" x2="40" y2="180" stroke="#10b981" stroke-width="1.5"/>
    <rect x="34" y="140" width="12" height="30" fill="#10b981" rx="1"/>

    <!-- Candlestick 2 (Red) -->
    <line x1="80" y1="120" x2="80" y2="170" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="74" y="130" width="12" height="25" fill="#ef4444" rx="1"/>

    <!-- Candlestick 3 (Green) -->
    <line x1="120" y1="100" x2="120" y2="155" stroke="#10b981" stroke-width="1.5"/>
    <rect x="114" y="110" width="12" height="35" fill="#10b981" rx="1"/>

    <!-- Candlestick 4 (Green - BUY SIGNAL) -->
    <line x1="160" y1="80" x2="160" y2="140" stroke="#10b981" stroke-width="1.5"/>
    <rect x="154" y="90" width="12" height="40" fill="#10b981" rx="1"/>
    <!-- Buy Marker -->
    <polygon points="160,150 154,162 166,162" fill="#34d399"/>
    <text x="160" y="174" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">BUY</text>

    <!-- Candlestick 5 (Green) -->
    <line x1="200" y1="60" x2="200" y2="115" stroke="#10b981" stroke-width="1.5"/>
    <rect x="194" y="70" width="12" height="35" fill="#10b981" rx="1"/>

    <!-- Candlestick 6 (Red) -->
    <line x1="240" y1="65" x2="240" y2="110" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="234" y="75" width="12" height="20" fill="#ef4444" rx="1"/>

    <!-- Candlestick 7 (Green Breakout) -->
    <line x1="280" y1="35" x2="280" y2="90" stroke="#10b981" stroke-width="1.5"/>
    <rect x="274" y="45" width="12" height="35" fill="#10b981" rx="1"/>

    <!-- Candlestick 8 (Green) -->
    <line x1="320" y1="20" x2="320" y2="70" stroke="#10b981" stroke-width="1.5"/>
    <rect x="314" y="30" width="12" height="30" fill="#10b981" rx="1"/>

    <!-- Legend -->
    <text x="15" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">AAPL • 1D CANDLES • EMA 50/200 CROSSOVER</text>
  </g>

  <!-- Right: Metrics & Risk Evaluation Card -->
  <g transform="translate(510, 90)">
    <rect width="215" height="210" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    
    <text x="15" y="24" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">QUANTITATIVE METRICS</text>
    
    <g transform="translate(15, 38)" font-family="'JetBrains Mono', monospace" font-size="10">
      <text y="15" fill="#94a3b8">Win Rate:</text>
      <text x="180" y="15" fill="#34d399" font-weight="700" text-anchor="end">68.4%</text>

      <text y="40" fill="#94a3b8">Sharpe Ratio:</text>
      <text x="180" y="40" fill="#38bdf8" font-weight="700" text-anchor="end">2.14</text>

      <text y="65" fill="#94a3b8">Profit Factor:</text>
      <text x="180" y="65" fill="#f59e0b" font-weight="700" text-anchor="end">2.85x</text>

      <text y="90" fill="#94a3b8">Max Drawdown:</text>
      <text x="180" y="90" fill="#ef4444" font-weight="700" text-anchor="end">-6.8%</text>

      <text y="115" fill="#94a3b8">Total Return:</text>
      <text x="180" y="115" fill="#10b981" font-weight="700" text-anchor="end">+42.6%</text>
    </g>

    <!-- Cumulative Equity Mini Bar -->
    <rect x="15" y="170" width="185" height="26" rx="4" fill="#040711" stroke="#334155" stroke-width="1"/>
    <text x="25" y="187" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9">Equity Curve: Outperforming SPY</text>
  </g>

  <!-- Bottom Console Status -->
  <g transform="translate(75, 315)">
    <rect width="650" height="80" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">⚡ Machine Learning Model: Random Forest &amp; XGBoost Regressor</text>
    <text x="15" y="46" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">Features: RSI (14), MACD (12,26,9), Bollinger Bands, Historical Volume Spikes</text>
    <text x="15" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Toolchain: Python • Pandas • NumPy • Scikit-learn • Matplotlib • Backtesting Engine</text>
  </g>
</svg>

