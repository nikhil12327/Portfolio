<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="editGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#editGrad)"/>

  <!-- Geometric Studio Light Framing -->
  <polygon points="100,800 250,150 450,150 550,800" fill="#3f3f46" opacity="0.3"/>
  <rect x="180" y="240" width="240" height="420" rx="4" fill="#09090b" stroke="#71717a" stroke-width="1.5"/>

  <!-- Subject Minimal Silhouette -->
  <g transform="translate(300, 380)">
    <circle cx="0" cy="0" r="42" fill="#52525b"/>
    <path d="M -60 70 L 60 70 L 50 240 L -50 240 Z" fill="#27272a"/>
    <line x1="-60" y1="70" x2="-80" y2="190" stroke="#71717a" stroke-width="10" stroke-linecap="round"/>
    <line x1="60" y1="70" x2="80" y2="190" stroke="#71717a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Editorial Magazine Title Overlay -->
  <text x="300" y="100" fill="#f4f4f5" font-family="'Inter', sans-serif" font-size="32" font-weight="900" letter-spacing="8" text-anchor="middle">PERSPECTIVE</text>
  <text x="300" y="125" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="10" letter-spacing="3" text-anchor="middle">STUDIO &amp; EDITORIAL ISSUE // 2025</text>

  <!-- Metadata -->
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="35" y="760" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="11">50MM • F/2.8 • 1/200S • ISO 100 • SOFTBOX DIRECTIONAL LIGHT</text>
</svg>

